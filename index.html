<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Agenda Ko (2026 - 2040)</title>

  <!-- iOS Home Screen App (PWA) Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agenda Ko" />

  <!-- IMPORTANTE: Apple Touch Icon Links para sa iPhone Home Screen -->
  <link id="apple-icon-180" rel="apple-touch-icon" sizes="180x180" href="Gemini_Generated_Image_vern4evern4evern.jpg" />
  <link id="apple-icon-default" rel="apple-touch-icon" href="Gemini_Generated_Image_vern4evern4evern.jpg" />
  <link id="favicon-link" rel="icon" type="image/jpeg" href="Gemini_Generated_Image_vern4evern4evern.jpg" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Separated CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 select-none">

  <!-- MAIN MOBILE CONTAINER -->
  <div class="max-w-md mx-auto px-4 pt-6 space-y-4">

    <!-- 1. TOP HEADER & GIANT BELL WIDGET -->
    <header class="glass-card rounded-3xl p-4 border border-slate-800 shadow-xl">
      <div class="flex items-center justify-between gap-3">
        <!-- App Title, Logo & Live Clock -->
        <div>
          <div class="flex items-center gap-2.5">
            <!-- IMONG APP LOGO ICON -->
            <img
              id="app-header-logo"
              src="Gemini_Generated_Image_vern4evern4evern.jpg"
              alt="Agenda Ko Logo"
              class="w-10 h-10 rounded-xl object-cover border border-indigo-400/40 shadow-md"
            />
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-cyan-300 to-emerald-300 bg-clip-text text-transparent">
                  Agenda Ko
                </h1>
                <span class="text-[11px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">
                  2026–2040
                </span>
              </div>
            </div>
          </div>
          <p id="live-clock" class="text-2xl font-mono font-bold text-white mt-1.5">
            00:00:00 AM
          </p>
          <p id="live-today-label" class="text-xs text-slate-400">
            Loading current date...
          </p>
        </div>

        <!-- DAKO NGA BELL ICON SA KILID -->
        <div id="giant-bell-box" class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-slate-900/90 border border-slate-700/80 transition-all duration-300">
          <!-- Pulsing ring indicator when alarm is active -->
          <div id="giant-bell-pulse" class="hidden absolute inset-0 rounded-2xl border-2 border-rose-500 animate-ping"></div>
          
          <svg id="giant-bell-svg" xmlns="http://www.w3.org/2000/svg" class="w-11 h-11 text-slate-400 transition-colors" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0113.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 01-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 11-7.48 0 24.585 24.585 0 01-4.831-1.244.75.75 0 01-.298-1.205A8.217 8.217 0 005.25 9.75V9zm4.502 8.9a2.25 2.25 0 104.496 0 25.057 25.057 0 01-4.496 0z" clip-rule="evenodd" />
          </svg>
          <span id="bell-state-text" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mt-1">
            Standby
          </span>
        </div>
      </div>

      <!-- SOUND & TEST ALARM CONTROLS -->
      <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
        <button id="btn-enable-sound" type="button" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition active:scale-95">
          🔊 Enable Sound (Off)
        </button>
        <button id="btn-test-alarm" type="button" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 transition active:scale-95">
          🔔 Test Alarm & Bell
        </button>
      </div>
    </header>

    <!-- 2. ACTIVE ALARM RINGING BANNER (MOGAWAS KON MAG-ALARM NA) -->
    <section id="active-alarm-banner" class="hidden rounded-3xl p-4 bg-gradient-to-r from-rose-600/90 to-amber-600/90 border-2 border-amber-300 shadow-2xl space-y-3">
      <div class="flex items-start gap-3">
        <div class="text-3xl bell-ringing">🔔</div>
        <div class="flex-1">
          <p class="text-xs font-black uppercase tracking-widest text-amber-100">
            ⏰ ORAS NA SA IMONG AGENDA!
          </p>
          <h2 id="alarm-banner-title" class="text-lg font-extrabold text-white leading-tight mt-0.5">
            Agenda Title Here
          </h2>
          <p id="alarm-banner-time" class="text-xs text-rose-100 font-mono mt-0.5">
            Scheduled: 00:00
          </p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 pt-1">
        <button id="btn-stop-alarm" type="button" class="py-2.5 px-2 rounded-xl bg-slate-950/90 text-white text-xs font-bold active:scale-95">
          🔕 Stop Bell
        </button>
        <button id="btn-snooze-alarm" type="button" class="py-2.5 px-2 rounded-xl bg-white/20 text-white text-xs font-bold border border-white/30 active:scale-95">
          💤 +5 Mins
        </button>
        <button id="btn-done-alarm" type="button" class="py-2.5 px-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold active:scale-95">
          ✓ Done Na
        </button>
      </div>
    </section>

    <!-- 3. DATE PICKER (MONTH, DAY, YEAR 2026 - 2040) -->
    <section class="glass-card rounded-3xl p-4 border border-slate-800 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
          📅 Pilia ang Petsa (2026–2040)
        </span>
        <button id="btn-jump-today" type="button" class="text-xs font-bold text-indigo-400 hover:text-indigo-300 px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20 active:scale-95">
          Karong Adlawa (Today)
        </button>
      </div>

      <!-- Month / Day / Year Dropdowns -->
      <div class="grid grid-cols-12 gap-2">
        <div class="col-span-5">
          <label class="block text-[10px] text-slate-400 mb-1 font-semibold">MONTH</label>
          <select id="select-month" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div class="col-span-3">
          <label class="block text-[10px] text-slate-400 mb-1 font-semibold">DAY</label>
          <select id="select-day" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div class="col-span-4">
          <label class="block text-[10px] text-slate-400 mb-1 font-semibold">YEAR</label>
          <select id="select-year" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm font-semibold text-amber-300 focus:outline-none focus:border-indigo-500"></select>
        </div>
      </div>

      <!-- MONDAY - SUNDAY DAY SELECTOR STRIP -->
      <div>
        <label class="block text-[10px] text-slate-400 mb-1.5 font-semibold uppercase">
          Pilia ang Adlaw (Monday – Sunday)
        </label>
        <div id="week-strip" class="grid grid-cols-7 gap-1.5">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>

      <!-- Selected Date Banner -->
      <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between">
        <div>
          <p id="selected-day-name" class="text-xs font-extrabold uppercase tracking-wider text-indigo-400">
            MONDAY
          </p>
          <h2 id="selected-full-date" class="text-base font-bold text-white">
            January 1, 2026
          </h2>
        </div>
        <div id="agenda-progress-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          0 / 0 Done
        </div>
      </div>
    </section>

    <!-- 4. ADD NEW AGENDA FORM -->
    <section class="glass-card rounded-3xl p-4 border border-slate-800 space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">
        ➕ Dugang og Agenda niining Petsaha
      </h3>

      <form id="form-add-agenda" class="space-y-2.5">
        <input
          id="input-agenda-title"
          type="text"
          placeholder="Unsay imong buhaton? (e.g. Meeting, Bayad Bills)"
          required
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
        />

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-400 mb-1 font-semibold">
              ⏰ ORAS SA ALARM (Optional)
            </label>
            <input
              id="input-agenda-time"
              type="time"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-amber-300 font-mono focus:outline-none focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-[10px] text-slate-400 mb-1 font-semibold">
              📌 PRIORITY
            </label>
            <select
              id="input-agenda-priority"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
            >
              <option value="normal">Normal</option>
              <option value="important">Important ⭐</option>
              <option value="urgent">Urgent 🔥</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold text-sm shadow-lg active:scale-98 transition"
        >
          + Save Agenda
        </button>
      </form>
    </section>

    <!-- 5. AGENDA LIST SECTION -->
    <section class="glass-card rounded-3xl p-4 border border-slate-800 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">
          📋 Imong Agenda List
        </h3>
        <div class="flex gap-1">
          <button id="filter-all" type="button" class="text-[11px] px-2.5 py-1 rounded-lg font-bold bg-indigo-600 text-white">
            All
          </button>
          <button id="filter-pending" type="button" class="text-[11px] px-2.5 py-1 rounded-lg font-bold bg-slate-800 text-slate-400">
            Pending
          </button>
          <button id="filter-done" type="button" class="text-[11px] px-2.5 py-1 rounded-lg font-bold bg-slate-800 text-slate-400">
            Done
          </button>
        </div>
      </div>

      <div id="agenda-list-container" class="space-y-2.5">
        <!-- Populated by app.js -->
      </div>
    </section>

  </div>

  <!-- Hidden iOS Audio Element (Dynamic WAV will be loaded here by alarm.js) -->
  <audio id="ios-alarm-audio" loop playsinline preload="auto"></audio>

  <!-- Separated JavaScript Files (Order: alarm.js first, then app.js) -->
  <script src="alarm.js"></script>
  <script src="app.js"></script>
</body>
</html>
